[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["trips"]
filterwarnings = ["ignore:No directory at:UserWarning"]
