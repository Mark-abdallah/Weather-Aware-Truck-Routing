name: Test and deploy

on:
  push:
    branches: [Deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy hooks are configured
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          test -n "$API_HOOK" || { echo "::error::Secret RENDER_DEPLOY_HOOK_API is not set"; exit 1; }
          test -n "$WEB_HOOK" || { echo "::error::Secret RENDER_DEPLOY_HOOK_WEB is not set"; exit 1; }
      - name: Deploy API
        run: curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      - name: Deploy web
        run: curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
